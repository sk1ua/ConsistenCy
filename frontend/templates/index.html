<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConsistenCy Dashboard</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Plotly -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    

    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-out',
                        'slide-in': 'slideIn 0.3s ease-out',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideIn: {
                            '0%': { transform: 'translateX(-100%)' },
                            '100%': { transform: 'translateX(0)' },
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .dark .glass {
            background: rgba(17, 24, 39, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .card-hover {
            transition: all 0.2s ease;
        }
        
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.1);
        }
        
        .dark .card-hover:hover {
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.5);
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .scroll-hide::-webkit-scrollbar {
            display: none;
        }
        
        .scroll-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        .loading-dots:after {
            content: '.';
            animation: dots 1.5s steps(5, end) infinite;
        }
        
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60% { content: '...'; }
            80%, 100% { content: ''; }
        }
        
        .risk-low { background: linear-gradient(135deg, #10b981, #059669); }
        .risk-medium { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .risk-high { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .risk-critical { background: linear-gradient(135deg, #7c3aed, #dc2626); }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-300">
    <div id="root"></div>
    
    <script type="text/babel">
        {% raw %}
        const { useState, useEffect, useCallback, useMemo } = React;
        
        // Simple SVG Icon components (no external dependencies)
        const Icons = {
            Activity: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>,
            AlertCircle: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
            BarChart3: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>,
            CheckCircle: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
            ChevronRight: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" /></svg>,
            Clock: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
            Code: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" /></svg>,
            Download: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>,
            FileText: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>,
            Folder: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" /></svg>,
            GitBranch: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4" /></svg>,
            GitCommit: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
            GitPullRequest: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" /></svg>,
            History: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
            LayoutDashboard: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>,
            Loader: () => <svg className="w-5 h-5 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>,
            Menu: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" /></svg>,
            Moon: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>,
            Search: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>,
            Shield: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>,
            Sun: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>,
            TrendingUp: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" /></svg>,
            Users: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>,
            X: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>,
            Zap: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>,
        };
        
        // API service
        const API = {
            async analyze(repoPath, commitSha = null, baselineCommits = 50) {
                const res = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        repo_path: repoPath, 
                        commit_sha: commitSha,
                        baseline_commits: baselineCommits 
                    })
                });
                if (!res.ok) throw new Error(await res.text());
                return res.json();
            },
            
            async analyzeRange(repoPath, weeks = 12) {
                const res = await fetch('/api/analyze-range', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ repo_path: repoPath, weeks })
                });
                if (!res.ok) throw new Error(await res.text());
                return res.json();
            },
            
            async prReport(repoPath, baseRef, headRef = 'HEAD') {
                const res = await fetch('/api/pr/report', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        repo_path: repoPath, 
                        base_ref: baseRef, 
                        head_ref: headRef 
                    })
                });
                if (!res.ok) throw new Error(await res.text());
                return res.json();
            },
            
            async export(repoPath, format = 'json', weeks = 12) {
                const res = await fetch('/api/export', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ repo_path: repoPath, format, weeks })
                });
                if (!res.ok) throw new Error(await res.text());
                return res.json();
            },
            
            async getHistory(repoPath, weeks = 12) {
                const res = await fetch(`/api/repo/history?repo_path=${encodeURIComponent(repoPath)}&weeks=${weeks}`);
                if (!res.ok) throw new Error(await res.text());
                return res.json();
            },
            
            async getFiles(repoPath) {
                const res = await fetch(`/api/repo/files?repo_path=${encodeURIComponent(repoPath)}`);
                if (!res.ok) throw new Error(await res.text());
                return res.json();
            },
            
            async getAuthors(repoPath) {
                const res = await fetch(`/api/repo/authors?repo_path=${encodeURIComponent(repoPath)}`);
                if (!res.ok) throw new Error(await res.text());
                return res.json();
            },
            
            async getHotspots(repoPath) {
                const res = await fetch(`/api/repo/hotspots?repo_path=${encodeURIComponent(repoPath)}`);
                if (!res.ok) throw new Error(await res.text());
                return res.json();
            }
        };
        
        // Utility components
        const Card = ({ children, className = '', onClick }) => (
            <div 
                onClick={onClick}
                className={`bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm card-hover ${className}`}
            >
                {children}
            </div>
        );
        
        const CardHeader = ({ children, className = '' }) => (
            <div className={`px-6 py-4 border-b border-gray-200 dark:border-gray-700 ${className}`}>
                {children}
            </div>
        );
        
        const CardContent = ({ children, className = '' }) => (
            <div className={`p-6 ${className}`}>
                {children}
            </div>
        );
        
        const Button = ({ 
            children, 
            variant = 'primary', 
            size = 'md', 
            disabled = false,
            loading = false,
            onClick,
            className = ''
        }) => {
            const variants = {
                primary: 'bg-primary-600 hover:bg-primary-700 text-white',
                secondary: 'bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-900 dark:text-gray-100',
                outline: 'border-2 border-gray-300 dark:border-gray-600 hover:border-primary-500 dark:hover:border-primary-500 text-gray-700 dark:text-gray-300',
                ghost: 'hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-700 dark:text-gray-300',
                danger: 'bg-red-600 hover:bg-red-700 text-white'
            };
            
            const sizes = {
                sm: 'px-3 py-1.5 text-sm',
                md: 'px-4 py-2 text-sm',
                lg: 'px-6 py-3 text-base'
            };
            
            return (
                <button
                    onClick={onClick}
                    disabled={disabled || loading}
                    className={`
                        inline-flex items-center justify-center gap-2 rounded-lg font-medium
                        transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed
                        ${variants[variant]} ${sizes[size]} ${className}
                    `}
                >
                    {loading && <Icons.Loader />}
                    {children}
                </button>
            );
        };
        
        const Badge = ({ children, variant = 'default' }) => {
            const variants = {
                default: 'bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300',
                success: 'bg-green-100 dark:bg-green-900/30 text-green-700 dark:text-green-400',
                warning: 'bg-yellow-100 dark:bg-yellow-900/30 text-yellow-700 dark:text-yellow-400',
                danger: 'bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-400',
                primary: 'bg-primary-100 dark:bg-primary-900/30 text-primary-700 dark:text-primary-400'
            };
            
            return (
                <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${variants[variant]}`}>
                    {children}
                </span>
            );
        };
        
        const ProgressBar = ({ value, max = 1, color = 'primary' }) => {
            const percentage = Math.min((value / max) * 100, 100);
            const colors = {
                primary: 'bg-primary-600',
                success: 'bg-green-500',
                warning: 'bg-yellow-500',
                danger: 'bg-red-500',
                gradient: 'bg-gradient-to-r from-primary-500 to-purple-500'
            };
            
            return (
                <div className="w-full h-2 bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden">
                    <div 
                        className={`h-full rounded-full transition-all duration-500 ${colors[color]}`}
                        style={{ width: `${percentage}%` }}
                    />
                </div>
            );
        };
        
        // Risk Score Gauge
        const RiskGauge = ({ score, size = 'md' }) => {
            const getColor = (s) => {
                if (s < 0.3) return '#10b981';
                if (s < 0.5) return '#f59e0b';
                if (s < 0.7) return '#ef4444';
                return '#7c3aed';
            };
            
            const getLevel = (s) => {
                if (s < 0.3) return 'Low';
                if (s < 0.5) return 'Medium';
                if (s < 0.7) return 'High';
                return 'Critical';
            };
            
            const sizes = {
                sm: { width: 80, height: 40, fontSize: 14 },
                md: { width: 120, height: 60, fontSize: 20 },
                lg: { width: 180, height: 90, fontSize: 28 }
            };
            
            const { width, height, fontSize } = sizes[size];
            const color = getColor(score);
            const percentage = score * 100;
            
            useEffect(() => {
                const data = [
                    {
                        domain: { x: [0, 1], y: [0, 1] },
                        value: percentage,
                        type: 'indicator',
                        mode: 'gauge+number',
                        gauge: {
                            axis: { range: [0, 100], tickwidth: 1 },
                            bar: { color, thickness: 0.75 },
                            bgcolor: 'transparent',
                            borderwidth: 0,
                            steps: [
                                { range: [0, 30], color: 'rgba(16, 185, 129, 0.1)' },
                                { range: [30, 50], color: 'rgba(245, 158, 11, 0.1)' },
                                { range: [50, 70], color: 'rgba(239, 68, 68, 0.1)' },
                                { range: [70, 100], color: 'rgba(124, 58, 237, 0.1)' }
                            ],
                            threshold: {
                                line: { color, width: 2 },
                                value: percentage
                            }
                        },
                        number: { suffix: '%', font: { size: fontSize, color } }
                    }
                ];
                
                const layout = {
                    width,
                    height,
                    margin: { t: 10, b: 10, l: 10, r: 10 },
                    paper_bgcolor: 'transparent',
                    plot_bgcolor: 'transparent',
                    font: { color: 'inherit' }
                };
                
                const config = { displayModeBar: false, staticPlot: true };
                
                Plotly.newPlot(`gauge-${size}-${score}`, data, layout, config);
            }, [score, size, width, height, fontSize, color]);
            
            return (
                <div className="flex flex-col items-center">
                    <div id={`gauge-${size}-${score}`} />
                    <span className={`text-sm font-semibold mt-1 ${
                        score < 0.3 ? 'text-green-600 dark:text-green-400' :
                        score < 0.5 ? 'text-yellow-600 dark:text-yellow-400' :
                        score < 0.7 ? 'text-red-600 dark:text-red-400' :
                        'text-purple-600 dark:text-purple-400'
                    }`}>
                        {getLevel(score)}
                    </span>
                </div>
            );
        };
        
        // Sidebar component
        const Sidebar = ({ activeTab, setActiveTab, collapsed, setCollapsed }) => {
            const navItems = [
                { id: 'dashboard', label: 'Dashboard', icon: Icons.LayoutDashboard },
                { id: 'scan', label: 'Quick Scan', icon: Icons.Zap },
                { id: 'history', label: 'History', icon: Icons.History },
                { id: 'files', label: 'Files', icon: Icons.FileText },
                { id: 'authors', label: 'Authors', icon: Icons.Users },
                { id: 'pr', label: 'PR Analysis', icon: Icons.GitPullRequest },
                { id: 'export', label: 'Export', icon: Icons.Download },
            ];
            
            return (
                <aside 
                    className={`fixed left-0 top-0 z-40 h-screen transition-all duration-300 bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-800 ${
                        collapsed ? 'w-16' : 'w-64'
                    }`}
                >
                    <div className="flex items-center justify-between h-16 px-4 border-b border-gray-200 dark:border-gray-800">
                        {!collapsed && (
                            <div className="flex items-center gap-2">
                                <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-primary-500 to-purple-600 flex items-center justify-center">
                                    <Icons.Shield />
                                </div>
                                <span className="font-bold text-lg gradient-text">ConsistenCy</span>
                            </div>
                        )}
                        {collapsed && (
                            <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-primary-500 to-purple-600 flex items-center justify-center mx-auto">
                                <Icons.Shield />
                            </div>
                        )}
                        <button 
                            onClick={() => setCollapsed(!collapsed)}
                            className="p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 lg:block hidden"
                        >
                            <Icons.Menu />
                        </button>
                    </div>
                    
                    <nav className="p-3 space-y-1">
                        {navItems.map(item => (
                            <button
                                key={item.id}
                                onClick={() => setActiveTab(item.id)}
                                className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all duration-200 ${
                                    activeTab === item.id 
                                        ? 'bg-primary-50 dark:bg-primary-900/20 text-primary-700 dark:text-primary-400' 
                                        : 'text-gray-700 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800'
                                }`}
                            >
                                <item.icon />
                                {!collapsed && <span>{item.label}</span>}
                            </button>
                        ))}
                    </nav>
                    
                    {!collapsed && (
                        <div className="absolute bottom-0 left-0 right-0 p-4 border-t border-gray-200 dark:border-gray-800">
                            <div className="text-xs text-gray-500 dark:text-gray-400">
                                <p>ConsistenCy v2.5.0</p>
                                <p className="mt-1">8 Agents Active</p>
                            </div>
                        </div>
                    )}
                </aside>
            );
        };
        
        // Header component
        const Header = ({ repoPath, setRepoPath, onAnalyze, loading, darkMode, setDarkMode }) => {
            const [inputPath, setInputPath] = useState(repoPath);
            
            const handleSubmit = (e) => {

                                    <div>
                                        <p className="text-sm text-gray-500">Risk Level</p>
                                        <p className="font-medium capitalize">{result.summary && result.summary.risk_level}</p>
                                    </div>
                                </div>
                            </CardContent>
                        </Card>
                    )}
                </div>
            );
        };
        
        // Main App Component
        const App = () => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
            const [repoPath, setRepoPath] = useState('');
            const [analysisData, setAnalysisData] = useState(null);
            const [loading, setLoading] = useState(false);
            const [analysisProgress, setAnalysisProgress] = useState({ step: 0, currentFile: '' });
            const [darkMode, setDarkMode] = useState(true);
            

            
            // Dark mode effect
            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [darkMode]);
            
            // Simulate progress steps during analysis
            const simulateProgress = () => {
                const steps = [
                    { step: 0, currentFile: '' },
                    { step: 1, currentFile: 'Scanning repository structure...' },
                    { step: 2, currentFile: 'Checking code style...' },
                    { step: 3, currentFile: 'Detecting security issues...' },
                    { step: 4, currentFile: 'Analyzing semantic patterns...' },
                    { step: 5, currentFile: 'Evaluating architecture...' },
                    { step: 6, currentFile: 'Computing final scores...' },
                ];
                
                let currentStep = 0;
                const interval = setInterval(() => {
                    if (currentStep < steps.length - 1) {
                        currentStep++;
                        setAnalysisProgress(steps[currentStep]);
                    }
                }, 800);
                
                return () => clearInterval(interval);
            };
            
            const handleAnalyze = async (path) => {
                if (!path) return;
                setLoading(true);
                setAnalysisProgress({ step: 0, currentFile: '' });
                setAnalysisData(null);
                
                const stopProgress = simulateProgress();
                
                try {
                    const data = await API.analyze(path);
                    setAnalysisProgress({ step: 6, currentFile: 'Complete!' });
                    await new Promise(r => setTimeout(r, 300)); // Brief pause to show completion
                    setAnalysisData(data);
                } catch (err) {
                    alert('Analysis failed: ' + err.message);
                } finally {
                    stopProgress();
                    setLoading(false);
                }
            };
            
            const renderContent = () => {
                switch (activeTab) {
                    case 'dashboard':
                        return <DashboardView data={analysisData} repoPath={repoPath} loading={loading} analysisProgress={analysisProgress} />;
                    case 'scan':
                        return <DashboardView data={analysisData} repoPath={repoPath} loading={loading} analysisProgress={analysisProgress} />;
                    case 'pr':
                        return <PRAnalysisView repoPath={repoPath} />;
                    case 'export':
                        return <ExportView repoPath={repoPath} />;
                    default:
                        return (
                            <div className="flex flex-col items-center justify-center h-[60vh]">
                                <Icons.Clock />
                                <h2 className="text-xl font-semibold mt-4">Coming Soon</h2>
                                <p className="text-gray-500">This feature is under development.</p>
                            </div>
                        );
                }
            };
            
            return (
                <div className="min-h-screen flex">
                    <Sidebar 
                        activeTab={activeTab} 
                        setActiveTab={setActiveTab}
                        collapsed={sidebarCollapsed}
                        setCollapsed={setSidebarCollapsed}
                    />
                    
                    <div className={`flex-1 transition-all duration-300 ${sidebarCollapsed ? 'ml-16' : 'ml-64'}`}>
                        <Header 
                            repoPath={repoPath}
                            setRepoPath={setRepoPath}
                            onAnalyze={handleAnalyze}
                            loading={loading}
                            darkMode={darkMode}
                            setDarkMode={setDarkMode}
                        />
                        
                        <main className="p-6">
                            {renderContent()}
                        </main>
                    </div>
                </div>
            );
        };
        
        // Render
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        {% endraw %}
    </script>
</body>
</html>
