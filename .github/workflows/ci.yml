name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50   # Fetch enough commits for baseline analysis

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt ruff

      - name: Lint (syntax and undefined-name gate)
        run: |
          ruff check backend frontend tests --select E9,F63,F7,F82

      - name: Check showcase JavaScript
        run: |
          node --check frontend/static/js/showcase.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install TypeScript workspace dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: TypeScript tests
        run: npm test

      - name: TypeScript build
        run: npm run build

      - name: Run tests
        env:
          PYTHONPATH: backend
        run: |
          pytest tests -q

      # PR Risk Analysis (only on pull_request events)
      - name: ConsistenCy PR Risk Analysis
        if: github.event_name == 'pull_request'
        env:
          PYTHONPATH: backend
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "${DEEPSEEK_API_KEY}" ]; then
            echo "LLM enabled: true (DEEPSEEK_API_KEY detected in secrets)"
          else
            echo "LLM enabled: false (set repository secret DEEPSEEK_API_KEY to enable AI review)"
          fi

          # Run PR analysis - failures will fail the CI step (no silent fallback)
          if ! python backend/cli.py pr-report \
            --repo . \
            --base ${{ github.event.pull_request.base.sha }} \
            --head ${{ github.event.pull_request.head.sha }} \
            --max-commits 20 \
            --json-output > /tmp/pr_report.json 2>&1; then
            echo "ERROR: PR analysis failed" >&2
            cat /tmp/pr_report.json >&2
            exit 1
          fi
          # Generate PR comment; --use-llm flag enables AI review when DEEPSEEK_API_KEY is set
          python - <<'PYEOF'
          import json, os, sys
          sys.path.insert(0, 'backend')
          from src.review_suggestions import generate_review_comment
          with open('/tmp/pr_report.json') as f:
              report = json.load(f)
          # Always request the AI section so missing-key status is explicit
          # in the PR comment when DEEPSEEK_API_KEY is not configured.
          comment = generate_review_comment(report, use_llm=True)
          with open('/tmp/pr_comment.md', 'w') as f:
              f.write(comment)
          PYEOF

      - name: Post ConsistenCy Review Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const comment = fs.readFileSync('/tmp/pr_comment.md', 'utf8').trim();
            if (comment.length > 0) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment,
              });
            }
