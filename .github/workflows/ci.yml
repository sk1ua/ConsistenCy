name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50   # Fetch enough commits for baseline analysis

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest ruff

      - name: Lint (syntax and undefined-name gate)
        run: |
          ruff check backend frontend tests --select E9,F63,F7,F82

      - name: Run tests
        env:
          PYTHONPATH: backend
        run: |
          pytest tests -q

      # PR Risk Analysis (only on pull_request events)
      - name: ConsistenCy PR Risk Analysis
        if: github.event_name == 'pull_request'
        env:
          PYTHONPATH: backend
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python backend/cli.py pr-report \
            --repo . \
            --base ${{ github.event.pull_request.base.sha }} \
            --head ${{ github.event.pull_request.head.sha }} \
            --max-commits 20 \
            --json-output > /tmp/pr_report.json 2>/dev/null \
            || echo '{"commit_count":0,"avg_risk":0,"max_risk":0,"high_risk_commits":0,"commits":[],"top_risky_files":[],"security_findings":[]}' > /tmp/pr_report.json
          # Generate PR comment; --use-llm flag enables AI review when DEEPSEEK_API_KEY is set
          python - <<'PYEOF'
          import json, os, sys
          sys.path.insert(0, 'backend')
          from src.review_suggestions import generate_review_comment
          with open('/tmp/pr_report.json') as f:
              report = json.load(f)
          use_llm = bool(os.environ.get('DEEPSEEK_API_KEY', '').strip())
          comment = generate_review_comment(report, use_llm=use_llm)
          with open('/tmp/pr_comment.md', 'w') as f:
              f.write(comment)
          PYEOF

      - name: Post ConsistenCy Review Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const comment = fs.readFileSync('/tmp/pr_comment.md', 'utf8').trim();
            if (comment.length > 0) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment,
              });
            }
