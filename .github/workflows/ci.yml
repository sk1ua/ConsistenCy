name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LLM_PROVIDER: mock

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50   # Fetch enough commits for baseline analysis

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: Verify editable project metadata
        run: python -m pip install --no-deps -e .

      - name: Lint (syntax and undefined-name gate)
        run: |
          ruff check engine tests evaluation/scripts examples

      - name: Python entrypoint smoke tests
        run: |
          python examples/multi_agent_demo.py
          python evaluation/scripts/run_ablation.py --help

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Verify fixed runtime baseline
        run: npm run verify:runtime

      - name: Verify documentation hygiene
        run: npm run verify:docs

      - name: Install TypeScript workspace dependencies
        run: npm ci

      - name: Audit Node dependencies
        run: npm run audit:deps

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: TypeScript tests
        run: npm test

      - name: TypeScript build
        run: npm run build

      - name: Run Python unit tests
        run: |
          python -m pytest -q

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Full-stack E2E
        run: npm run test:e2e
