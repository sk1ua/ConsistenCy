<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2317201d'/%3E%3Cpath d='M21 10a8 8 0 1 0 0 12' fill='none' stroke='%237fe1ba' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>ConsistenCy</title>
  </head>
  <body>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the
      // wrong theme. Mirrors resolveTheme() in src/theme.tsx.
      try {
        var theme = localStorage.getItem("consistency.theme.v1") || "dark";
        var dark = theme === "dark" ||
          (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
