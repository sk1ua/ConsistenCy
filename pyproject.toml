[project]
name = "consistency"
version = "2.5.0"
description = "Multi-signal code review assistant for pull requests"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "ConsistenCy Team"},
]
requires-python = ">=3.11"
dependencies = [
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-python>=0.25,<0.26",
    "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5.0,<7",
    "jsonschema>=4.22,<5",
    "ruff==0.15.20",
]

[project.scripts]
consistency = "engine.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["engine", "engine.*"]
exclude = ["tests", "tests.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = [
    ".git",
    ".pytest_cache",
    "evaluation/repos",
    "pytest-cache-files-*",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"
